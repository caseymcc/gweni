<!doctype html>
<!--
  Gweni
  Copyright (c) 2010 Facepunch Studios
  MIT License, see LICENSE

  The hosted site's control gallery (tools/build_site.sh): ControlTest's
  interactive window (ControlTest.js, with web/pre.js inside it) in the
  #canvas-container below the header. The URL query is ControlTest's argv, so
  controltest.html?control=ButtonDemo&scale=2 is "ControlTest --control
  ButtonDemo --scale 2" and every control has a link of its own. The picker's
  entries are ControlTest --list, written in at build time where the
  gweni:controls comment is; choosing one loads the page again with that
  control, every other parameter (scale) kept.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gweni control gallery</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:,">
</head>
<body class="app">
<header>
<a class="name" href="index.html">gweni</a>
<label for="control">Control</label>
<select id="control">
<option value="ShowcaseContainersDemo">ShowcaseContainersDemo</option>
<option value="ShowcaseButtonsDemo">ShowcaseButtonsDemo</option>
<option value="ShowcaseInputDemo">ShowcaseInputDemo</option>
<option value="ShowcaseDisplayDemo">ShowcaseDisplayDemo</option>
<option value="ShowcaseWindowsDemo">ShowcaseWindowsDemo</option>
<option value="ButtonDemo">ButtonDemo</option>
<option value="LabelDemo">LabelDemo</option>
<option value="LabelMultilineDemo">LabelMultilineDemo</option>
<option value="ProgressBarDemo">ProgressBarDemo</option>
<option value="GroupBoxDemo">GroupBoxDemo</option>
<option value="ImagePanelDemo">ImagePanelDemo</option>
<option value="StatusBarDemo">StatusBarDemo</option>
<option value="SeparatorDemo">SeparatorDemo</option>
<option value="ComboBoxDemo">ComboBoxDemo</option>
<option value="TextBoxDemo">TextBoxDemo</option>
<option value="ListBoxDemo">ListBoxDemo</option>
<option value="SelectableDemo">SelectableDemo</option>
<option value="VirtualListDemo">VirtualListDemo</option>
<option value="ContextMenuDemo">ContextMenuDemo</option>
<option value="PopupDemo">PopupDemo</option>
<option value="CrossSplitterDemo">CrossSplitterDemo</option>
<option value="RadioButtonDemo">RadioButtonDemo</option>
<option value="CheckBoxDemo">CheckBoxDemo</option>
<option value="NumericDemo">NumericDemo</option>
<option value="SliderDemo">SliderDemo</option>
<option value="MenuStripDemo">MenuStripDemo</option>
<option value="WindowDemo">WindowDemo</option>
<option value="WindowButtonsDemo">WindowButtonsDemo</option>
<option value="TreeControlDemo">TreeControlDemo</option>
<option value="PropertiesDemo">PropertiesDemo</option>
<option value="TabControlDemo">TabControlDemo</option>
<option value="ScrollControlDemo">ScrollControlDemo</option>
<option value="PageControlDemo">PageControlDemo</option>
<option value="CollapsibleListDemo">CollapsibleListDemo</option>
<option value="ColorPickerDemo">ColorPickerDemo</option>
<option value="UnicodeTextDemo">UnicodeTextDemo</option>
<option value="TextSizesDemo">TextSizesDemo</option>
<option value="TextDemo">TextDemo</option>
<option value="LayoutDemo">LayoutDemo</option>
<option value="Demo">Demo (the whole docked demo)</option>
</select>
<nav>
<a href="demo.html">Demo</a>
<a href="https://github.com/caseymcc/gweni">GitHub</a>
</nav>
</header>
<div id="canvas-container">
<canvas id="canvas" width="64" height="64" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>
<pre id="output"></pre>
<script>
(function()
{
    var picker = document.getElementById('control');
    var params = new URLSearchParams(location.search);
    // ControlTest's own default when the query names none
    picker.value = params.get('control') || 'ButtonDemo';
    picker.addEventListener('change', function()
    {
        params.set('control', picker.value);
        location.search = params.toString();
    });
})();
</script>
<script async src="ControlTest.js"></script>
</body>
</html>
