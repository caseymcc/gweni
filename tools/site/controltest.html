  The hosted site's control gallery (tools/build_site.sh): ControlTest's
  interactive window (ControlTest.js, with web/pre.js inside it) in the
  #canvas-container below the header. The URL query is ControlTest's argv, so
  controltest.html?control=ButtonDemo&scale=2 is "ControlTest --control
  ButtonDemo --scale 2" and every control has a link of its own. The picker's
  entries are ControlTest --list, written in at build time where the
  gweni:controls comment is; choosing one loads the page again with that
  control, every other parameter (scale, depth-view) kept.

  The "Depth view" checkbox opens and closes ControlTest's depth view
  (gweni::tools::DepthView) live, through its gweni_web_depth_view(on) export,
  and keeps depth-view in the URL as it is. It starts as ?depth-view says
  (--depth-view, which opens the view after the first frame; depth-view=off
  leaves it closed) and follows the view however it opens or closes (F9,
  Escape in the view), which ControlTest tells the page through
  Module.gweniDepthViewChanged. Before the window has drawn a frame a change
  loads the page again with the new parameter. The "Z spacing" slider beside
  it is the open view's spacing factor on a log scale, x0.1 to x20 of its
  reset spacing (gweni_web_depth_view_spacing), disabled while the view is
  closed and moved to the factor the view tells the page of
  (Module.gweniDepthViewSpacingChanged: +/- and Alt+wheel in the view, R, the
  open); let go, the canvas has the keyboard again. The header's built-from comment
  becomes the commit the site was built from, linked to it, on the header's
  one row, so the canvas keeps its height.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gweni control gallery</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:,">
</head>
<body class="app">
<header>
<a class="name" href="index.html">gweni</a>
<label for="control">Control</label>
<select id="control">
<!-- gweni:controls -->
</select>
<label><input type="checkbox" id="depth-view"> Depth view</label>
<label class="z-spacing" title="The depth view's spacing between layers, x0.1 to x20 of its reset spacing: +/- or Alt+wheel in the view, R resets">Z spacing <input type="range" id="z-spacing" min="-1" max="1.30103" step="any" value="0" disabled> <output id="z-spacing-value">&times;1.00</output></label>
<nav>
<span class="built-from"><!-- gweni:built-from --></span>
<a href="demo.html">Demo</a>
<a href="https://github.com/caseymcc/gweni">GitHub</a>
</nav>
</header>
<div id="canvas-container">
<canvas id="canvas" width="64" height="64" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>
<pre id="output"></pre>
<script>
var Module = {};
(function()
{
    var picker = document.getElementById('control');
    var depth = document.getElementById('depth-view');
    var canvas = document.getElementById('canvas');
    var params = new URLSearchParams(location.search);
    // ControlTest's own default when the query names none
    picker.value = params.get('control') || 'ButtonDemo';
    // the query with a flag bare ("depth-view", not "depth-view=")
    function query()
    {
        return '?' + params.toString().replace(/=(&|$)/g, '$1');
    }
    picker.addEventListener('change', function()
    {
        params.set('control', picker.value);
        location.search = query();
    });

    // a bare depth-view (or =on) is --depth-view, depth-view=off --depth-view off
    depth.checked = params.has('depth-view') && params.get('depth-view') !== 'off';
    // the URL says what the view is, so a reload (the picker's) keeps it
    function keepInUrl(open)
    {
        if(open)
            params.set('depth-view', '');
        else
            params.delete('depth-view');
        history.replaceState(null, '', query());
    }
    depth.addEventListener('change', function()
    {
        keepInUrl(depth.checked);
        if(!(window.gweniRun && gweniRun.frames > 0))
        {
            location.reload();
            return;
        }
        var state = Module.ccall('gweni_web_depth_view', 'string', ['number'], [depth.checked ? 1 : 0]);
        depth.checked = state === 'view=open';
        keepInUrl(depth.checked);
        // the view's keys (Escape, the camera's) go to the canvas
        canvas.focus();
    });
    // The "Z spacing" slider: the depth view's spacing factor on a log scale,
    // x0.1 to x20 (log10 -1 to 1.30103), through gweni_web_depth_view_spacing,
    // enabled only while the view is open, and set to the factor the view
    // tells the page of (Module.gweniDepthViewSpacingChanged: +/-, Alt+wheel,
    // R, the open)
    var spacing = document.getElementById('z-spacing');
    var spacingValue = document.getElementById('z-spacing-value');
    function showSpacing(factor)
    {
        spacing.value = Math.log10(factor);
        spacingValue.textContent = '\u00d7' + factor.toFixed(2);
    }
    function setSpacingOpen(open)
    {
        spacing.disabled = !open;
    }
    spacing.addEventListener('input', function()
    {
        var state = Module.ccall('gweni_web_depth_view_spacing', 'string', ['number'],
            [Math.pow(10, Number(spacing.value))]);
        var factor = /factor=([0-9.e+-]+)/.exec(state);
        if(factor && state.startsWith('view=open'))
            showSpacing(Number(factor[1]));
    });
    // let go: the view's keys go to the canvas again
    spacing.addEventListener('change', function() { canvas.focus(); });
    Module.gweniDepthViewSpacingChanged = showSpacing;
    Module.gweniDepthViewChanged = function(open)
    {
        depth.checked = open;
        keepInUrl(open);
        setSpacingOpen(open);
    };
})();
</script>
<script async src="ControlTest.js"></script>
</body>
</html>
